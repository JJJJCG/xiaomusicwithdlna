name: CI Workflow

on:
  push:
    branches:
      - "*" # 所有分支触发构建；只在 main / v* tag 上推送镜像
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write # 推镜像到 GHCR 需要

jobs:
  # 构建 amd64 镜像 -> 冒烟测试 -> 推送 GHCR
  # 镜像地址: ghcr.io/<owner>/<repo>:latest
  # 用仓库自带的 GITHUB_TOKEN 登录，无需配置任何 secret
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，而 GitHub 用户名可能含大写字母
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 冒烟测试 1: CLI 可用
      - name: Test CLI
        run: docker run --rm ${{ env.IMAGE }}:ci-test /app/.venv/bin/python3 /app/xiaomusic.py -h

      # 冒烟测试 2: 投送依赖真的装上了且能导入
      # av / zeroconf 是新增的重型依赖 (PyAV 走 abi3 musllinux wheel)，
      # 装不上或不兼容会在这里暴露，而不是等用户投送时才发现
      - name: Test cast dependencies
        run: |
          docker run --rm ${{ env.IMAGE }}:ci-test /app/.venv/bin/python3 -c "
          import av, zeroconf
          print('av', av.__version__)
          print('zeroconf', zeroconf.__version__)
          import xiaomusic.cast
          print('xiaomusic.cast import ok')
          "

      - name: Push to GHCR
        if: github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
