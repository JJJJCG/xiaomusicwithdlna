    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width">
    <title>M3U to JSON Converter</title>
    <style>
      body {
        margin: 0 auto;
        padding: 24px 16px;
        max-width: 720px;
        font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #191c22;
        background: #f5f6f8;
      }
      h1 { font-size: 20px; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
        padding: 8px;
        border: 1px solid #dfe3ea;
        border-radius: 8px;
        background: #fff;
        color: inherit;
      }
      button {
        font: inherit;
        margin: 10px 0;
        padding: 7px 16px;
        border: 1px solid #dfe3ea;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      button:hover { background: #eceef2; }
      footer { margin-top: 24px; color: #626976; font-size: 13px; }
      footer a { color: #e8543f; }
      @media (prefers-color-scheme: dark) {
        body { color: #e8eaf0; background: #12131a; }
        textarea { background: #1b1d26; border-color: #2a2e3a; }
        button { background: #1b1d26; border-color: #2a2e3a; color: inherit; }
        button:hover { background: #0d0e14; }
      }
    </style>

    <script>
function handleFileSelect(evt) {
  var file = evt.target.files[0];
  if (file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('m3u-input').value = e.target.result;
    };
    reader.readAsText(file);
  } else {
    alert('无法加载文件');
  }
}

function convertToJSON() {
  var m3uContent = document.getElementById('m3u-input').value;
  var lines = m3uContent.split('\n');
  console.log(lines);
  var musicsArray = [];
  var currentName = '';
  lines.forEach(function(line) {
    line = line.trim();
    if (line.startsWith('#EXTINF:')) {
      currentName = line.replace(/.*,/g, '');
    } else if (line.startsWith('http') && currentName !== '') {
      musicsArray.push({"name": currentName, "type": "radio", "url": line});
      currentName = ''; // Reset the name for the next entry
    }
  });
  var output = [{
    "name": "m3u电台",
    "musics": musicsArray
  }];

  document.getElementById('json-output').value = JSON.stringify(output, null, 2);
}
    </script>
  </head>
  <body>
    <h1>M3U to JSON Converter</h1>
    <input type="file" id="file-input" accept=".m3u" onchange="handleFileSelect(event)"/><br>
    <textarea id="m3u-input" rows="10" cols="50" placeholder="粘贴m3u内容或上传文件..."></textarea><br>
    <button onclick="convertToJSON()">转换</button><br>
    <textarea id="json-output" rows="10" cols="50" placeholder="转换后的JSON..."></textarea>
  </body>
