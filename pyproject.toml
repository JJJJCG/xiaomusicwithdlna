[project]
name = "xiaomusic"
version = "0.6.1"
description = "Play Music with xiaomi AI speaker"
authors = [
{name = "涵曦", email = "im.hanxi@gmail.com"},
]
dependencies = [
    "aiohttp>=3.8.6",
    "watchdog>=6.0.0",
    "mutagen>=1.47.0",
    "yt-dlp[default]>=2024.12.1.232904.dev0",
    "uvicorn>=0.30.1",
    "fastapi>=0.115.4",
    "starlette>=0.37.2",
    "aiofiles>=24.1.0",
    "ga4mp>=2.0.4",
    "apscheduler>=3.10.4",
    "opencc-python-reimplemented==0.1.7",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
    "requests>=2.32.3",
    "sentry-sdk[fastapi]==1.45.1",
    "pyjwt>=2.10.1",
    "fake-useragent>=2.2.0",
    "miservice-fork",
    "edge-tts>=7.2.3",
    "psutil>=5.9.0",
    "pycryptodome>=3.23.0",
    "qrcode>=8.2",
    # 投送支持 (DLNA 渲染器 / AirPlay 接收器)，见 xiaomusic/cast/
    "av>=14.0.0",
    "zeroconf>=0.38.0"
]
requires-python = ">=3.10"
readme = "README.md"
# 投送功能 (xiaomusic/cast/) 派生自 GPL-3.0 的 MiAir Next，
# 组合作品整体按 GPL-3.0-or-later 分发，详见 NOTICE
license = {text = "GPL-3.0-or-later"}

[project.urls]
Homepage = "https://github.com/hanxi/xiaomusic"

[project.scripts]
xiaomusic = "xiaomusic.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
[tool.pdm.dev-dependencies]
lint = [
    "ruff>=0.4.8",
]
dev = [
    "commitizen>=3.27.0",
]
[tool.ruff]
lint.select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle - Error
    "F", # Pyflakes
    "I", # isort
    "W", # pycodestyle - Warning
    "UP", # pyupgrade
]
lint.ignore = [
    "E501", # line-too-long
    "W191", # tab-indentation
]
include = ["**/*.py", "**/*.pyi", "**/pyproject.toml"]
# 投送协议层为移植代码 (源自 MiAir Next)，保持与上游一致、不纳入 lint：
# ruff --fix 的 UP 规则会重写遗留写法，format 也会大改 fairplay3.py 等文件。
# 上游 miair-next 同样把 engine 目录排除在外。适配层不在此列，正常参与 lint。
extend-exclude = ["xiaomusic/cast/dlna", "xiaomusic/cast/airplay"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.File"
]

[tool.pdm.scripts]
lint = "ruff check . --exclude MiService"
fmt = "ruff format . --exclude MiService"
lintfmt = {composite = ["ruff check --fix . --exclude MiService", "ruff format . --exclude MiService"]}

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
version_files = [
    "xiaomusic/__init__.py",
]
